<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Makeup Artist Booking System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Makeup Artist Booking System</h1>
        <span class="badge bg-primary fs-6">Total Revenue: ₹<span th:text="${totalRevenue}">0.0</span></span>
    </div>

    <div class="row gy-4">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title">Add New Booking</h2>
                    <form th:action="@{/bookings}" th:object="${booking}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Booking ID</label>
                            <input type="number" th:field="*{bookingId}" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Customer Name</label>
                            <input type="text" th:field="*{customerName}" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Service Name</label>
                            <input type="text" th:field="*{serviceName}" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Amount</label>
                            <input type="number" step="0.01" th:field="*{amount}" class="form-control" required />
                        </div>
                        <button type="submit" class="btn btn-success">Add Booking</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h2 class="card-title">Search Customer</h2>
                    <form th:action="@{/search}" method="get" class="row g-3">
                        <div class="col-9">
                            <input type="text" name="name" class="form-control" placeholder="Customer Name" th:value="${searchName}" />
                        </div>
                        <div class="col-3">
                            <button type="submit" class="btn btn-primary w-100">Search</button>
                        </div>
                    </form>
                    <div th:if="${searchResults != null}">
                        <h3 class="mt-4">Search Results</h3>
                        <div th:if="${searchResults.isEmpty()}">
                            <p class="text-muted">No matching bookings found.</p>
                        </div>
                        <table th:if="${!searchResults.isEmpty()}" class="table table-sm mt-2">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Customer</th>
                                    <th>Service</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="booking : ${searchResults}">
                                    <td th:text="${booking.bookingId}"></td>
                                    <td th:text="${booking.customerName}"></td>
                                    <td th:text="${booking.serviceName}"></td>
                                    <td th:text="${booking.amount}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title">All Bookings</h2>
                    <table class="table table-striped table-bordered table-sm">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Customer</th>
                                <th>Service</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="booking : ${bookings}">
                                <td th:text="${booking.bookingId}"></td>
                                <td th:text="${booking.customerName}"></td>
                                <td th:text="${booking.serviceName}"></td>
                                <td th:text="${booking.amount}"></td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:if="${bookings.isEmpty()}" class="text-muted">No bookings yet.</div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
